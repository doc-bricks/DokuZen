<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DokuZen">
  <title>DokuZen Companion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icons/dokureader-companion-192.png">
  <link rel="apple-touch-icon" href="icons/dokureader-companion-180.png">
</head>
<body>
  <header>
    <div class="logo-area">
      <span class="logo-badge">DOKUZEN</span>
      <h1>Companion</h1>
    </div>
    <div class="header-actions">
      <select id="lang-select" class="lang-select" aria-label="Sprachauswahl / Language">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="zh">简体中文</option>
        <option value="ja">日本語</option>
        <option value="ru">Русский</option>
      </select>
      <button id="import-btn" data-i18n="import_btn" data-i18n-title="import_btn_title" title="JSON Arbeitsbereich importieren">JSON importieren</button>
      <button id="demo-btn" class="secondary" data-i18n="demo_btn" data-i18n-title="demo_btn_title" title="Demo-Arbeitsbereich laden">Demo laden</button>
      <input type="file" id="file-input" accept=".json" hidden>
    </div>
  </header>

  <div id="dropzone" class="dropzone" data-i18n-aria="dropzone_aria" aria-label="JSON-Datei hierher ziehen">
    <p data-i18n="dropzone_text">dokuzen-workspace-v1.json hierher ziehen oder klicken zum Auswählen</p>
  </div>

  <div class="stats-bar">
    <span class="stat-item"><span data-i18n="stat_themes">Themen:</span> <strong id="stat-themes">0</strong></span>
    <span class="stat-item"><span data-i18n="stat_docs">Dokumente:</span> <strong id="stat-docs">0</strong></span>
    <span class="stat-item"><span data-i18n="stat_read">Gelesen:</span> <strong id="stat-read">0</strong></span>
    <span class="stat-item"><span data-i18n="stat_forms">Formulare:</span> <strong id="stat-forms">0</strong></span>
  </div>

  <main class="main-layout">
    <aside class="sidebar">
      <h2 data-i18n="themes_heading">Themen</h2>
      <ul id="theme-list" class="theme-list"></ul>
    </aside>

    <section class="content-area">
      <div class="filter-bar">
        <input type="search" id="search-input" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="Dokument, Notiz oder #Tag suchen…">
        <select id="status-select" class="status-select" data-i18n-aria="status_select_aria" aria-label="Status-Filter">
          <option value="all" data-i18n="status_all">Alle Status</option>
          <option value="unread" data-i18n="status_unread">Ungelesen</option>
          <option value="read" data-i18n="status_read">Gelesen</option>
        </select>
      </div>

      <div id="doc-list" class="doc-list"></div>

      <div id="forms-section" class="forms-section" hidden>
        <h3 data-i18n="forms_heading">Formular-Vorlagen</h3>
        <div id="forms-badges" class="form-badges"></div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
