<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        letter-spacing: -0.2px;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
      .mono-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
      }
    </style>
    
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051214"/>
      <stop offset="50%" stop-color="#0b2226"/>
      <stop offset="100%" stop-color="#030c0e"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="320" cy="170" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#051214" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.8"/>
    </linearGradient>
    
  </defs>
  
  
    <!-- Background -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="none" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.2"/>
    <circle cx="320" cy="170" r="260" fill="url(#glow-teal)"/>
    
    <!-- Zen Circles / Enso Geometry -->
    <circle cx="260" cy="170" r="110" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>
    <circle cx="260" cy="170" r="85" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.4"/>
    <circle cx="260" cy="170" r="60" fill="none" stroke="#99f6e4" stroke-width="1" opacity="0.6"/>
    
    <!-- Stacked Document Cards (Glassmorphism) -->
    <g transform="translate(180, 90)">
      <!-- Back Card -->
      <rect x="30" y="0" width="130" height="160" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" opacity="0.6" transform="rotate(-8 95 80)"/>
      <!-- Mid Card -->
      <rect x="30" y="0" width="130" height="160" rx="12" fill="url(#card-grad)" stroke="#2dd4bf" stroke-width="1.5" opacity="0.8" transform="rotate(4 95 80)"/>
      <!-- Front Card -->
      <rect x="25" y="5" width="130" height="160" rx="12" fill="#0b2c2f" stroke="#5eead4" stroke-width="2"/>
      <!-- Card Content: Document lines & Zen Lotus / Quill Icon -->
      <line x1="45" y1="35" x2="135" y2="35" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
      <line x1="45" y1="55" x2="115" y2="55" stroke="#99f6e4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="45" y1="72" x2="125" y2="72" stroke="#99f6e4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <line x1="45" y1="89" x2="95" y2="89" stroke="#99f6e4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      
      <!-- Zen Stone / Badge on card -->
      <circle cx="90" cy="125" r="18" fill="#14b8a6" opacity="0.3"/>
      <circle cx="90" cy="125" r="10" fill="#2dd4bf"/>
      <circle cx="90" cy="125" r="4" fill="#ffffff"/>
    </g>
    
  
    <g transform="translate(480, 0)">
      <!-- Ecosystem Badge -->
      <g transform="translate(0, 58)">
        <rect width="180" height="26" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="1"/>
        <text x="90" y="17" text-anchor="middle" class="badge-text" fill="#5eead4">DOC-BRICKS SUITE</text>
      </g>
      
      <!-- Title -->
      <text x="0" y="142" class="title" font-size="58" fill="url(#title-grad)">DokuZen</text>
      
      <!-- Subtitle -->
      <text x="0" y="184" class="subtitle" font-size="20" fill="#ccfbf1">Distraction-Free Document, Text &amp; PDF Workshop Suite</text>
      <text x="0" y="210" class="subtitle" font-size="14" fill="#99f6e4" opacity="0.8">22 modular tools: OCR, PDF merging, batch conversion, and redaction in one local app.</text>
      
      <!-- Feature Pills -->
      <g transform="translate(0, 246)">
        <g transform="translate(0, 0)">
          <rect width="140" height="32" rx="8" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
          <text x="70" y="20" text-anchor="middle" class="pill-text" fill="#a7f3d0">📄 PDF Workshop</text>
        </g>
        <g transform="translate(152, 0)">
          <rect width="130" height="32" rx="8" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
          <text x="65" y="20" text-anchor="middle" class="pill-text" fill="#a7f3d0">🔍 Tesseract OCR</text>
        </g>
        <g transform="translate(294, 0)">
          <rect width="140" height="32" rx="8" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5"/>
          <text x="70" y="20" text-anchor="middle" class="pill-text" fill="#a7f3d0">🔒 100% Local-First</text>
        </g>
      </g>
    </g>
    
</svg>