name: Linux-Bundle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "tools/build_linux_bundle.py"
      - "packaging/linux/**"
      - "translator.py"
      - "locales/**"
      - "assets/**"
      - "config/**"
      - "tests/test_linux_packaging.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_linux_bundle.py --check
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_linux_packaging.py -q

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux runtime and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libegl1 tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build portable Linux tarball
        run: python tools/build_linux_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: DokuZen-linux
          path: dist/linux/DokuZen-*.tar.gz
          if-no-files-found: error
