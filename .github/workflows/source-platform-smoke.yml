name: Source-Platform-Smoke

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux: Qt-Offscreen-Renderer und Tesseract installieren
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libegl1 \
            tesseract-ocr

      # macOS: Tesseract über Homebrew
      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: brew install tesseract

      # Reduzierte Abhängigkeiten: kein PyQt6-WebEngine, kein pystray/keyboard/pyperclip
      - name: Install Python deps (CI subset)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "PySide6>=6.5.0" \
            "PyMuPDF>=1.23.0" \
            "pikepdf>=8.0.0" \
            "pytesseract>=0.3.10" \
            "Pillow>=10.0.0" \
            "python-docx>=1.1.0" \
            "chardet>=5.0.0" \
            "rapidfuzz>=3.0.0" \
            pytest \
            pytest-subtests

      - name: Run source-platform smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest tests/test_source_platform_smoke.py -v

      - name: Run cross-platform open and registry tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest tests/test_search_bar_platform_open.py tests/test_registry_platform_import.py -v

      - name: Run store-materials and readiness tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest tests/test_store_materials.py tests/test_store_readiness.py -v

      - name: Run licenses and metadata parity tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pytest tests/test_third_party_licenses.py tests/test_metadata.py -v

      - name: Compileall byte-compilation validation
        run: |
          python -m compileall -q .
